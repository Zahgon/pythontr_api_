; Alembic configuration for pythontr_api.
;
; The database URL is deliberately absent: migrations/env.py resolves it from
; app.db.build_url(), which reads the DB_* environment settings. Nothing here
; may hardcode a connection string.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
version_table = schema_migrations
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
